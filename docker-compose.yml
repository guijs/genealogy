version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: genealogy-postgres
    environment:
      POSTGRES_USER: genealogy
      POSTGRES_PASSWORD: genealogy
      POSTGRES_DB: genealogy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genealogy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
