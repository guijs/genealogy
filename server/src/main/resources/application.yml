server:
  port: 8080

spring:
  application:
    name: genealogy-server

  datasource:
    url: jdbc:postgresql://localhost:5432/genealogy
    username: genealogy
    password: genealogy
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

jwt:
  secret: ${JWT_SECRET:change-me-in-production-min-32-chars-long-secret-key}
  expiration-hours: 24

logging:
  level:
    root: INFO
    com.genealogy: DEBUG
