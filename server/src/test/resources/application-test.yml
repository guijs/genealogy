spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

jwt:
  secret: test-secret-key-for-jwt-token-generation-min-32-chars
  expiration-hours: 24

media:
  storage: local
  upload-secret: test-upload-secret-key-for-hmac-min-32-chars
  upload-token-expiry-minutes: 15
  local:
    root: ${java.io.tmpdir}/genealogy-test-media
